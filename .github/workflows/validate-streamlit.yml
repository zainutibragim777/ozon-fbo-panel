name: Validate Streamlit dashboard Python
on:
  push:
    paths:
      - "streamlit_app.py"
      - "method2_supply.py"
      - "method2_state.py"
      - "method1_state.py"
      - "method1_validation.py"
      - "method1_report.py"
      - "tests/test_method2.py"
      - "tests/test_method2_state.py"
      - "tests/test_method1_state.py"
      - "tests/test_method1_report_format.py"
      - "tests/test_method1_validation.py"
      - "tests/test_method1_calculate.py"
      - "tests/test_method1_report.py"
      - ".github/workflows/validate-streamlit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax before using the dashboard
        run: python3 -m py_compile streamlit_app.py method2_supply.py method2_state.py method1_state.py method1_validation.py
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Test Method 2 with mocked Ozon
        run: PYTHONPATH=. python3 tests/test_method2.py
      - name: Test queue persistence after a page refresh
        run: PYTHONPATH=. python3 tests/test_method2_state.py
      - name: Test Method 1 Excel and plan persistence
        run: PYTHONPATH=. python3 tests/test_method1_state.py
      - name: Test Method 1 report format replacement
        run: PYTHONPATH=. python3 tests/test_method1_report_format.py
      - name: Test Method 1 input validation
        run: PYTHONPATH=. python3 tests/test_method1_validation.py
      - name: Test Method 1 allocation boundaries
        run: PYTHONPATH=. python3 tests/test_method1_calculate.py
      - name: Test Method 1 Ozon report parsing
        run: PYTHONPATH=. python3 tests/test_method1_report.py
